<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Store App Pages</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #111827, #1f2937);
      }

      main {
        width: min(680px, 92vw);
        padding: 2.5rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        color: #f9fafb;
        backdrop-filter: blur(6px);
      }

      h1 {
        margin-top: 0;
      }

      p {
        margin-bottom: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apple Store App Pages</h1>
      <p>
        This site hosts pages for the Apple Store app. Add additional app pages in this
        repository as the project grows.
      </p>
    </main>
  </body>
</html>
